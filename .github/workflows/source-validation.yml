name: U Unlocked Source Validation

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation run for a branch/PR; obsolete commits do
# not need to occupy Windows runners while newer commits are waiting.
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-profile-tests:
    name: Build and test controller profiles
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDL3
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgCommand = Get-Command vcpkg.exe -ErrorAction Stop
            $vcpkgRoot = Split-Path $vcpkgCommand.Source
          }
          $env:VCPKG_ROOT = $vcpkgRoot
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install sdl3:x64-windows zstd:x64-windows

      - name: Configure controller test target
        shell: pwsh
        run: cmake -S engine/tests/controller_profile_unit -B build/controller-profile-tests -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build controller tests
        run: cmake --build build/controller-profile-tests --config Release

      - name: Run controller tests
        run: ctest --test-dir build/controller-profile-tests -C Release --output-on-failure

      - name: Fetch pinned ZArchive source
        shell: pwsh
        run: |
          python engine/tools/setup_deps.py ZArchive
          if ($LASTEXITCODE -ne 0) { throw 'Fetching pinned ZArchive failed.' }

      - name: Configure Windows WUA extractor compile check
        shell: pwsh
        run: cmake -S engine/tests/wua_extract_compile -B build/wua-extract-compile -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Compile Windows WUA extractor
        run: cmake --build build/wua-extract-compile --config Release

      - name: Fetch pinned stb headers
        shell: pwsh
        run: |
          python engine/tools/setup_deps.py stb
          if ($LASTEXITCODE -ne 0) { throw 'Fetching pinned stb headers failed.' }
          if (-not (Test-Path 'engine/third_party/stb/stb_image.h')) { throw 'stb_image.h is missing.' }
          if (-not (Test-Path 'engine/third_party/stb/stb_truetype.h')) { throw 'stb_truetype.h is missing.' }
          if (-not (Test-Path 'engine/third_party/stb/LICENSE')) { throw 'The stb licence notice is missing.' }

      - name: Configure launcher compile check
        shell: pwsh
        run: cmake -S engine/tests/launcher_compile -B build/launcher-compile -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Compile complete launcher source
        run: cmake --build build/launcher-compile --config Release

      - name: Generate release launcher icon
        shell: pwsh
        run: |
          ./tools/windows/new-u-unlocked-icon.ps1 -SourceRoot (Join-Path $PWD 'engine')
          if (-not (Test-Path 'engine/runtime/res/u-unlocked.ico')) {
            throw 'The release launcher icon was not generated.'
          }
          $logoPath = 'engine/runtime/res/title-logo.png'
          if (-not (Test-Path -LiteralPath $logoPath -PathType Leaf)) {
            throw 'The project-owned in-game title logo was not generated.'
          }
          Add-Type -AssemblyName System.Drawing
          $logo = [System.Drawing.Bitmap]::new($logoPath)
          try {
            if ($logo.Width -ne 1600 -or $logo.Height -ne 500) {
              throw "Unexpected title-logo dimensions: $($logo.Width)x$($logo.Height)"
            }
            if ($logo.GetPixel(0, 0).A -ne 0 -or $logo.GetPixel(250, 76).A -eq 0) {
              throw 'The title logo must have transparent padding and visible artwork.'
            }
          }
          finally {
            $logo.Dispose()
          }

      - name: Configure linked launcher release target
        shell: pwsh
        run: |
          cmake -S engine/tests/launcher_release -B build/launcher-release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher release configuration failed.' }

      - name: Build and link redistributable launcher
        shell: pwsh
        run: |
          cmake --build build/launcher-release --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'The redistributable launcher failed to compile or link.' }

  windows-vulkan-runtime-build:
    name: Compile complete Vulkan runtime without game data
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap compiler and use runner build utilities
        shell: pwsh
        run: |
          ./tools/windows/setup-build-environment.ps1 -UseSystemTools
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime toolchain bootstrap failed.' }

      - name: Fetch and build pinned Vulkan/runtime dependencies
        shell: pwsh
        run: |
          ./engine/tools/windows/build-deps.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime dependency build failed.' }

      - name: Package, relocate, and verify precompiled player dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'u-unlocked-prebuilt-dependencies.zip'
          & ./engine/tools/windows/package-prebuilt-dependencies.ps1 -EngineRoot (Join-Path $PWD 'engine') -OutputArchive $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'The precompiled dependency archive was not created.' }

          $testEngine = Join-Path $env:RUNNER_TEMP 'relocated-engine'
          New-Item -ItemType Directory -Force -Path (Join-Path $testEngine 'tools/windows') | Out-Null
          Copy-Item -LiteralPath 'engine/dependencies.lock.json' -Destination $testEngine
          Copy-Item -LiteralPath 'engine/tools/windows/build-deps.ps1' -Destination (Join-Path $testEngine 'tools/windows/build-deps.ps1')
          & ./tools/windows/install-prebuilt-dependencies.ps1 -ArchivePath $archive -EngineRoot $testEngine
          if (-not (Test-Path -LiteralPath (Join-Path $testEngine 'build-deps/prefix/lib/libvulkan-1.a') -PathType Leaf)) {
            throw 'The relocated prebuilt Vulkan import library is missing.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $testEngine 'build-deps/prefix/bin/SDL3.dll') -PathType Leaf)) {
            throw 'The relocated prebuilt SDL3 runtime is missing.'
          }

          $checkProject = Join-Path $env:RUNNER_TEMP 'prebuilt-sdl-cmake-check'
          New-Item -ItemType Directory -Force -Path $checkProject | Out-Null
          @'
          cmake_minimum_required(VERSION 3.20)
          project(PrebuiltSDLCheck LANGUAGES C CXX)
          find_package(SDL3 REQUIRED CONFIG)
          add_executable(prebuilt_sdl_check main.cpp)
          target_link_libraries(prebuilt_sdl_check PRIVATE SDL3::SDL3)
          '@ | Set-Content -LiteralPath (Join-Path $checkProject 'CMakeLists.txt') -Encoding UTF8
          @'
          #define SDL_MAIN_HANDLED
          #include <SDL3/SDL.h>
          int main() { return 0; }
          '@ | Set-Content -LiteralPath (Join-Path $checkProject 'main.cpp') -Encoding UTF8
          $compilerBin = (Resolve-Path 'toolchain/llvm-mingw/bin').Path
          $env:PATH = "$compilerBin;$env:PATH"
          $relocatedPrefix = Join-Path $testEngine 'build-deps/prefix'
          cmake -S $checkProject -B (Join-Path $checkProject 'build') -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++ "-DCMAKE_PREFIX_PATH=$relocatedPrefix"
          if ($LASTEXITCODE -ne 0) { throw 'The relocated SDL3 CMake package did not configure.' }
          cmake --build (Join-Path $checkProject 'build')
          if ($LASTEXITCODE -ne 0) { throw 'The relocated SDL3 package did not compile and link.' }

      - name: Create and verify the pinned dependency release bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'u-unlocked-dependency-bundle.zip'
          python engine/tools/setup_deps.py --bundle-output $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw 'Creating the pinned dependency release bundle failed.'
          }
          python engine/tools/setup_deps.py --bundle-archive $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Verifying the pinned dependency release bundle failed.' }

      - name: Build recompiler and runtime build utilities
        shell: pwsh
        run: |
          ./engine/tools/windows/build-recomp.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Recompiler and function finder build failed.' }

      - name: Configure generated-code compile fixtures
        shell: pwsh
        run: |
          $compilerBin = (Resolve-Path 'toolchain/llvm-mingw/bin').Path
          $env:PATH = "$compilerBin;$env:PATH"
          $updateFixture = (Resolve-Path 'engine/tests/cmake_game_targets/fixtures/update').Path
          $baseFixture = (Resolve-Path 'engine/tests/cmake_game_targets/fixtures/base').Path
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++ -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DCMAKE_EXE_LINKER_FLAGS=-static "-DSMASH_GENERATED_DIR=$updateFixture" "-DSMASH_BASE_GENERATED_DIR=$baseFixture"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration with generated game compile fixtures failed.' }

      - name: Compile Vulkan runtime, game host, CPU variants, launcher, and WUA tool
        shell: pwsh
        run: |
          $compilerBin = (Resolve-Path 'toolchain/llvm-mingw/bin').Path
          $env:PATH = "$compilerBin;$env:PATH"
          ninja -j 2 -C engine/build cafe_runtime smash_host_compile_check_v3 smash_host_compile_check_v2 smash_update_generated_v3 smash_update_generated_v2 smash_base_generated_v3 smash_base_generated_v2 smash-launcher wua_extract
          if ($LASTEXITCODE -ne 0) { throw 'The complete Vulkan runtime, host, CPU variants, launcher, or WUA extractor failed to compile/link.' }

      - name: Build and verify the complete player release package
        shell: pwsh
        run: |
          ./tools/windows/new-u-unlocked-icon.ps1 -SourceRoot (Join-Path $PWD 'engine')
          if ($LASTEXITCODE -ne 0) { throw 'Release icon and title-logo generation failed.' }
          if (-not (Test-Path -LiteralPath 'engine/runtime/res/title-logo.png' -PathType Leaf)) {
            throw 'The project-owned title logo is missing for release packaging.'
          }

          ./engine/tools/windows/package-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Complete player release packaging failed.' }

          $version = [regex]::Match((Get-Content -LiteralPath 'engine/launcher/smash/main.cpp' -Raw), 'kVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to resolve the launcher version for package validation.' }
          $zip = Join-Path $PWD "dist/U-Unlocked-v$version-Windows-Launcher.zip"
          $checksum = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or -not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw 'The release ZIP or SHA-256 sidecar is missing.'
          }
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'The release package SHA-256 sidecar does not match.' }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $required = @('package-manifest.json', 'U Unlocked.exe', 'wua_extract.exe', 'title-logo.png',
              'update-launcher.ps1', 'build-kit.zip', 'dependency-bundle.zip',
              'prebuilt-dependencies.zip', 'cafe-recomp.exe', 'RUNTIME-BUILD-REQUIRED.txt')
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($name in $required) {
              if ($names -cnotcontains $name) { throw "Release package is missing $name." }
            }

            $manifestEntry = $archive.GetEntry('package-manifest.json')
            $reader = [IO.StreamReader]::new($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($manifest.schema_version -ne 1 -or $manifest.version -ne $version) {
              throw 'Release package manifest schema or version does not match the launcher.'
            }
            foreach ($file in $manifest.files) {
              $name = [string]$file.name
              $entry = $archive.GetEntry($name)
              if (-not $entry -or $name.Contains('/') -or $file.sha256 -notmatch '^[0-9a-fA-F]{64}
  validate:
