name: U Unlocked Source Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and branding overlay
    runs-on: windows-latest
    steps:
      - name: Check out repository and pinned upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source checkout
        shell: pwsh
        run: ./tools/windows/verify-checkout.ps1 -SkipToolchainCheck

      - name: Apply branding overlay to a clean source copy
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'u-unlocked-upstream-check'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          $robocopy = Join-Path $env:SystemRoot 'System32\robocopy.exe'
          & $robocopy (Join-Path $PWD 'upstream') $source /E /R:2 /W:2 /XD '.git' /XF '.git' /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) {
            throw "Unable to copy upstream source for overlay validation: $LASTEXITCODE"
          }
          ./tools/windows/apply-u-unlocked-branding.ps1 -SourceRoot $source
          $icon = Join-Path $source 'runtime\res\u-unlocked.ico'
          if (-not (Test-Path -LiteralPath $icon -PathType Leaf)) {
            throw 'Branding overlay did not generate the U Unlocked icon.'
          }

      - name: Parse project PowerShell scripts
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path
          $files = Get-ChildItem -Path (Join-Path $root 'tools') -Filter '*.ps1' -Recurse -File
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell syntax validation failed: $($file.FullName)"
            }
          }

      - name: Ensure protected game data is not tracked
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $forbidden = @($tracked | Where-Object {
            $_ -match '(^|/)(0005000010144F00|0005000E10144F00|0005000C10144F00|UserData|saves|console|keys|generated)(/|$)' -or
            $_ -match '\.wua$|(^|/)cross_f\.rpx$'
          })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Error "Protected game data is tracked: $_" }
            throw 'Protected game data must never be committed.'
          }
